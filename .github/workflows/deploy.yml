# Publishes the site to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that every local file the page links to exists
        run: |
          python3 - <<'PY'
          import re, os, sys
          html = open("index.html", encoding="utf-8").read()
          refs = set(re.findall(r'(?:src|href)="([^"#:?]+)"', html))
          refs |= set(re.findall(r'url\(([^)]+)\)', open("assets/fonts.css").read()))
          missing = [r for r in refs if not os.path.exists(r) and not os.path.exists(os.path.join("assets", r))]
          if missing:
              sys.exit("Missing files: " + ", ".join(sorted(missing)))
          print(f"OK: {len(refs)} local references resolved")
          PY

      - name: Stage the public files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
